name: Docker — Build & Publish

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  release:
    types: [published]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  docker:
    name: Build multi-arch image
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write   # required for ghcr.io push

    steps:
      - uses: actions/checkout@v4

      # ARM64 support via QEMU (enables Raspberry Pi builds).
      # Note: only the small runtime stage is emulated — the heavy `cli-build`
      # stage is pinned to $BUILDPLATFORM and runs natively for both targets.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # Login to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Sanitize branch name for use as image tag (pull_request and workflow_dispatch)
      - name: Compute branch tag
        id: branch
        run: |
          # For PR events GITHUB_REF_NAME is "N/merge" — use head_ref instead
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH="${{ github.head_ref }}"
          else
            BRANCH="${GITHUB_REF_NAME}"
          fi
          SAFE=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/-\+/-/g' | sed 's/^-//;s/-$//')
          if [[ "$BRANCH" == "main" ]]; then
            echo "is_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_main=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$SAFE" >> "$GITHUB_OUTPUT"

      # Resolve the source repo + commit the deployed builder image was built from,
      # so the CLI baked into the publisher image is built from the SAME fork at the
      # SAME commit (CLI ↔ builder lockstep — prevents the apiCompatibility mismatch).
      # Reads the OCI labels of ghcr.io/<owner>/builder:latest; falls back to the
      # webstudio-community fork's `develop` tip if the labels can't be read.
      - name: Resolve builder source + commit (CLI lockstep)
        id: builder
        run: |
          set -uo pipefail
          CFG=$(docker run --rm gcr.io/go-containerregistry/crane:latest \
            config "ghcr.io/${{ github.repository_owner }}/builder:latest" 2>/dev/null || true)
          REV=$(jq -r '.config.Labels["org.opencontainers.image.revision"] // empty' <<<"$CFG" 2>/dev/null || true)
          SRC=$(jq -r '.config.Labels["org.opencontainers.image.source"] // empty' <<<"$CFG" 2>/dev/null || true)
          if [ -z "$REV" ]; then
            echo "::warning::Could not read builder revision label; falling back to 'develop'"
            REV=develop
          fi
          if [ -z "$SRC" ]; then
            SRC=https://github.com/webstudio-community/webstudio-fork
          fi
          REPO="${SRC%.git}.git"
          echo "Building CLI from ${REPO}@${REV}"
          echo "ref=$REV" >> "$GITHUB_OUTPUT"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"

      # Derive image tags:
      #   push to main                           → :latest
      #   workflow_dispatch on main              → :latest
      #   workflow_dispatch on other branch      → :<sanitized-branch>
      #   pull_request                           → :<sanitized-branch>
      #   published release                      → :<version> + :latest
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/webstudio-publisher
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && steps.branch.outputs.is_main == 'true') }}
            type=raw,value=${{ steps.branch.outputs.tag }},enable=${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && steps.branch.outputs.is_main == 'false' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            WEBSTUDIO_REF=${{ steps.builder.outputs.ref }}
            WEBSTUDIO_REPO=${{ steps.builder.outputs.repo }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
