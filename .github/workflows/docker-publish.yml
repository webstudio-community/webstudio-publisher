name: Docker — Build & Publish

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  release:
    types: [published]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  docker:
    name: Build multi-arch image
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write   # required for ghcr.io push

    outputs:
      image-tag: ${{ steps.branch.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      # ARM64 support via QEMU (enables Raspberry Pi builds)
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # Login to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Sanitize branch name for use as image tag (pull_request and workflow_dispatch).
      - name: Compute branch tag
        id: branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          sanitize() {
            echo "$1" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/-\+/-/g' | sed 's/^-//;s/-$//'
          }

          # For PR events GITHUB_REF_NAME is "N/merge" — use head_ref instead
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH="$HEAD_REF"
          else
            BRANCH="${GITHUB_REF_NAME}"
          fi

          SAFE=$(sanitize "$BRANCH")
          if [[ "$BRANCH" == "main" ]]; then
            echo "is_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_main=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Image tag: $SAFE"
          echo "tag=$SAFE" >> "$GITHUB_OUTPUT"

      # Derive image tags:
      #   push to main                           → :latest
      #   workflow_dispatch on main              → :latest
      #   workflow_dispatch on other branch      → :<sanitized-branch>
      #   pull_request                           → :<sanitized-branch>
      #   published release                      → :<version> + :latest
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/webstudio-publisher
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && steps.branch.outputs.is_main == 'true') }}
            type=raw,value=${{ steps.branch.outputs.tag }},enable=${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && steps.branch.outputs.is_main == 'false' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # For PRs, comment with the publisher image tag and digest so the branch can be
  # tested on the Coolify test stack. Upsert into an existing comment so each
  # synchronize event updates the same comment instead of spamming (marker:
  # <!-- test-images -->). Skip for PRs from external forks (readonly token).
  comment-pr:
    name: Comment PR with publisher image
    runs-on: ubuntu-24.04
    needs: docker
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      pull-requests: write

    steps:
      - name: Extract image info
        id: image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/webstudio-publisher
          IMAGE_TAG: ${{ needs.docker.outputs.image-tag }}
        run: |
          set -euo pipefail
          TAG="${IMAGE_NAME}:${IMAGE_TAG}"
          DIGEST=$(docker buildx imagetools inspect "$TAG" --format '{{ .Manifest.Digest }}' 2>/dev/null || echo "unknown")
          SHORT_SHA="${{ github.event.pull_request.head.sha }}" && SHORT_SHA="${SHORT_SHA:0:7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Upsert PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TAG: ${{ steps.image.outputs.tag }}
          DIGEST: ${{ steps.image.outputs.digest }}
          SHORT_SHA: ${{ steps.image.outputs.short_sha }}
        run: |
          set -euo pipefail
          BODY="$RUNNER_TEMP/publisher-image-comment.md"
          {
            echo "<!-- test-images -->"
            echo "### 🐳 Test image: publisher"
            echo ""
            echo "**Tag**: \`$TAG\`"
            echo ""
            echo "**Digest**: \`$DIGEST\`"
            echo ""
            echo "**Platforms**: linux/amd64, linux/arm64"
            echo ""
            echo "📋 For Coolify test bench:"
            echo ""
            echo "\`\`\`bash"
            echo "export PUBLISHER_IMAGE=$TAG"
            echo "\`\`\`"
            echo ""
            echo "[View package](https://github.com/${{ github.repository }}/pkgs/container/webstudio-publisher) · Updated for \`$SHORT_SHA\` · $(date -u '+%Y-%m-%d %H:%M UTC')"
          } > "$BODY"

          CID=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq 'map(select(.user.type == "Bot" and (.body | contains("<!-- test-images -->")))) | first | .id // empty')

          if [ -n "$CID" ]; then
            jq -Rs '{body: .}' "$BODY" | gh api -X PATCH "repos/$REPO/issues/comments/$CID" --input - >/dev/null
            echo "Updated comment $CID on PR #$PR"
          else
            jq -Rs '{body: .}' "$BODY" | gh api -X POST "repos/$REPO/issues/$PR/comments" --input - >/dev/null
            echo "Created comment on PR #$PR"
          fi
